<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="{% block description %}Memorize scripture word-for-word and keep it, using methods with strong scientific support.{% endblock %}" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png" />
  <link rel="stylesheet" href="/static/css/fonts.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="doc-page">

  <a class="doc-brand" href="/about"><span class="logo-icon">&#x05D0;</span><span class="logo-text">LogosDepth</span></a>
  <nav class="doc-nav" aria-label="Site">
    <a href="/about">About</a>

</main>
