name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  javascript:
    name: JavaScript (lint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: playwright install --with-deps chromium
      - name: Start the app
        run: |
          gunicorn app:app --bind 127.0.0.1:5000 --workers 2 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/healthz && break || sleep 1; done
      - run: python tests/e2e.py
      - run: python tests/a11y_audit.py
      - run: python tests/e2e_sync.py
